services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sublearn
      MYSQL_USER: sublearn
      MYSQL_PASSWORD: sublearn
      MYSQL_ROOT_PASSWORD: sublearn
    ports:
      - "3306:3306"
    volumes:
      - sublearn-mysql-data:/var/lib/mysql

volumes:
  sublearn-mysql-data:
