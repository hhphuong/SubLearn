services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sublearn
      MYSQL_USER: sublearn
      MYSQL_PASSWORD: sublearn
      MYSQL_ROOT_PASSWORD: sublearn
    ports:
      - "3306:3306"
    volumes:
      - sublearn-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psublearn"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./BE/SubLearn
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sublearn
      DB_USERNAME: sublearn
      DB_PASSWORD: sublearn
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      YTDLP_PATH: yt-dlp
      YTDLP_COOKIES_PATH: /tmp/youtube-cookies.txt
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - see .env.example}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./secrets/youtube-cookies.txt:/run/secrets/youtube-cookies-source.txt:ro
    entrypoint:
      - sh
      - -c
      - >-
        cp /run/secrets/youtube-cookies-source.txt /tmp/youtube-cookies.txt
        && chmod 600 /tmp/youtube-cookies.txt
        && exec java -jar app.jar
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./FE
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sublearn-mysql-data:
