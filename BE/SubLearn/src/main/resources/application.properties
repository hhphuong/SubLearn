spring.application.name=SubLearn

# Database (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sublearn}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:sublearn}
spring.datasource.password=${DB_PASSWORD:sublearn}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway manages the schema; Hibernate only validates it matches
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS - frontend dev server origin
sublearn.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# yt-dlp binary location (must be installed separately, not managed by Maven)
sublearn.ytdlp.path=${YTDLP_PATH:yt-dlp}
sublearn.ytdlp.timeout-seconds=${YTDLP_TIMEOUT_SECONDS:60}
sublearn.ytdlp.cookies-path=${YTDLP_COOKIES_PATH:}

# Gemini API
sublearn.gemini.api-key=${GEMINI_API_KEY:}
sublearn.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
sublearn.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
sublearn.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
sublearn.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:20000}

# JWT
sublearn.jwt.secret=${JWT_SECRET:}
sublearn.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
sublearn.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:sublearn}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:sublearn}
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Async job retry policy
sublearn.job.max-retries=${JOB_MAX_RETRIES:5}
sublearn.job.retry-delay-ms=${JOB_RETRY_DELAY_MS:5000}

# Admin module
sublearn.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
sublearn.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
sublearn.admin.bulk-retry-max-batch=${ADMIN_BULK_RETRY_MAX_BATCH:20}
sublearn.admin.password-reset-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
sublearn.frontend.base-url=${FRONTEND_ORIGIN:http://localhost:5173}

# Optional SMTP email (used for admin-triggered password reset)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
sublearn.mail.from=${MAIL_FROM:no-reply@sublearn.local}
