# Layered on top of src/main/resources/application.properties (profile "test") for
# full-context smoke tests (e.g. SubLearnApplicationTests) so they don't require the real
# MySQL instance from docker-compose or a real JWT secret. Flyway is disabled and
# Hibernate generates the schema directly from the entities, since the MySQL-specific
# migration SQL isn't H2-compatible.
sublearn.jwt.secret=test-only-secret-key-not-for-production-use-1234567890

spring.datasource.url=jdbc:h2:mem:sublearn-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
